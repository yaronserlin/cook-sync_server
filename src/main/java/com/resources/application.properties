# ===============================
# SERVER CONFIGURATION
# ===============================
# הפורט עליו ירוץ השרת (ברירת מחדל היא 8080)
server.port=8080

# ===============================
# DATABASE (MySQL) CONFIGURATION
# ===============================
# נתיב החיבור למסד הנתונים. שים לב לשם מסד הנתונים (cook-sync_db)
spring.datasource.url=jdbc:mysql://localhost:3306/cook-sync_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# שם המשתמש למסד הנתונים (לרוב root בסביבת פיתוח מקומית)
spring.datasource.username=root

# הסיסמה למסד הנתונים (שנה לסיסמה שלך)
spring.datasource.password=812Yaron155!

# הדרייבר של MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
# עדכון אוטומטי של הסכימה במסד הנתונים בהתאם למחלקות ה-Entities שכתבנו
spring.jpa.hibernate.ddl-auto=update

# הדפסת שאילתות ה-SQL לטרמינל (מעולה לדיבוג והבנת הפעולות מאחורי הקלעים)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# הגדרת הניב (Dialect) המדויק של MySQL כדי ש-Hibernate ידע לייצר שאילתות אופטימליות
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect